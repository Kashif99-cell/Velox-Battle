
<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>VELOX BATTLE 3D</title>
<style>
body{margin:0;overflow:hidden;background:#111;font-family:Arial;color:white;touch-action:none}
canvas{display:block}
#hud{position:absolute;top:10px;left:10px;background:#111c;padding:12px;border-radius:12px;pointer-events:none}
#title{color:#00eaff;font-size:22px;font-weight:bold}
#controls{position:absolute;bottom:20px;width:100%;display:flex;justify-content:space-between;padding:0 20px;box-sizing:border-box;pointer-events:none}
#joy,#fire{pointer-events:auto;width:105px;height:105px;border-radius:50%;background:#152d49bb;border:2px solid #00dfff;color:white;touch-action:none}
#fire{background:#a51d2d;padding:10px;font-weight:bold}
#msg{position:absolute;top:45%;width:100%;text-align:center;color:#00eaff;font-size:25px;pointer-events:none}
</style>
</head>
<body>
<div id="hud">
<div id="title">VELOX BATTLE 3D</div>
❤️ HP: <span id="hp">100</span><br>
🎯 Kills: <span id="kills">0</span><br>
🤖 Enemies: <span id="count">6</span>
</div>
<div id="msg">BATTLE START!</div>
<div id="controls">
<button id="joy">MOVE</button>
<button id="fire">FIRE 🔫</button>
</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x8ac9ed);
scene.fog=new THREE.Fog(0x8ac9ed,40,110);

const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,200);
const renderer=new THREE.WebGLRenderer({antialias:false});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1));
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x536d42,2));
const light=new THREE.DirectionalLight(0xffffff,2);
light.position.set(20,40,20);
scene.add(light);

const ground=new THREE.Mesh(
new THREE.PlaneGeometry(150,150),
new THREE.MeshStandardMaterial({color:0x53844a})
);
ground.rotation.x=-Math.PI/2;
scene.add(ground);

const player=new THREE.Group();
const blue=new THREE.MeshStandardMaterial({color:0x00aaff});
const skin=new THREE.MeshStandardMaterial({color:0xe8b58c});
const dark=new THREE.MeshStandardMaterial({color:0x252b35});

function part(parent,geo,mat,x,y,z){
const m=new THREE.Mesh(geo,mat);
m.position.set(x,y,z);
parent.add(m);
return m;
}
part(player,new THREE.CapsuleGeometry(.4,.8,4,8),blue,0,.85,0);
part(player,new THREE.SphereGeometry(.25,12,10),skin,0,1.5,0);
part(player,new THREE.BoxGeometry(.14,.14,.85),dark,.4,1,-.4);
scene.add(player);

const enemies=[];
function createEnemy(x,z){
const e=new THREE.Group();
part(e,new THREE.CapsuleGeometry(.38,.8,4,8),new THREE.MeshStandardMaterial({color:0xe54c36}),0,.8,0);
part(e,new THREE.SphereGeometry(.24,10,8),skin,0,1.5,0);
e.position.set(x,0,z);
scene.add(e);
enemies.push(e);
}
for(let i=0;i<6;i++){
createEnemy(Math.random()*35-17,Math.random()*35-17);
}

const trees=[];
for(let i=0;i<35;i++){
const x=Math.random()*90-45,z=Math.random()*90-45;
if(Math.hypot(x,z)<9)continue;
part(scene,new THREE.CylinderGeometry(.2,.3,2),new THREE.MeshStandardMaterial({color:0x76502d}),x,1,z);
part(scene,new THREE.ConeGeometry(1.3,3,7),new THREE.MeshStandardMaterial({color:0x17522c}),x,3,z);
}

let yaw=0,health=100,kills=0,playing=true;
let moving=false,moveX=0,moveY=0;
let keys={};
const bullets=[];
const hp=document.getElementById('hp');
const msg=document.getElementById('msg');

onkeydown=e=>keys[e.key.toLowerCase()]=true;
onkeyup=e=>keys[e.key.toLowerCase()]=false;

const joy=document.getElementById('joy');
let joyId=null;
joy.onpointerdown=e=>{
joyId=e.pointerId;
joy.setPointerCapture(joyId);
moving=true;
moveX=e.offsetX/joy.clientWidth-.5;
moveY=e.offsetY/joy.clientHeight-.5;
};
joy.onpointermove=e=>{
if(joyId!==e.pointerId)return;
const r=joy.getBoundingClientRect();
moveX=(e.clientX-r.left-r.width/2)/(r.width/2);
moveY=(e.clientY-r.top-r.height/2)/(r.height/2);
};
joy.onpointerup=joy.onpointercancel=()=>{
joyId=null;moving=false;moveX=0;moveY=0;
};

let lookId=null,lastX=0;
renderer.domElement.addEventListener('pointerdown',e=>{
lookId=e.pointerId;lastX=e.clientX;
});
renderer.domElement.addEventListener('pointermove',e=>{
if(lookId!==e.pointerId)return;
yaw-=(e.clientX-lastX)*.007;
lastX=e.clientX;
});
renderer.domElement.addEventListener('pointerup',()=>lookId=null);
renderer.domElement.addEventListener('pointercancel',()=>lookId=null);

function shoot(){
if(!playing)return;
const dir=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw));
const start=player.position.clone().add(new THREE.Vector3(0,1,0));
bullets.push({pos:start,dir:dir.clone(),life:40});
}
document.getElementById('fire').onpointerdown=e=>{
e.preventDefault();shoot();
};

function finish(t){
playing=false;
msg.textContent=t;
}
const clock=new THREE.Clock();

function animate(){
requestAnimationFrame(animate);
const dt=Math.min(clock.getDelta(),.04);

if(playing){
let x=moveX,z=moveY;
if(keys.w||keys.arrowup)z=-1;
if(keys.s||keys.arrowdown)z=1;
if(keys.a||keys.arrowleft)x=-1;
if(keys.d||keys.arrowright)x=1;

if(Math.abs(x)+Math.abs(z)>.1){
let len=Math.hypot(x,z);
x/=len;z/=len;
const speed=7;
player.position.x+=(x*Math.cos(yaw)-z*Math.sin(yaw))*speed*dt;
player.position.z+=(x*Math.sin(yaw)+z*Math.cos(yaw))*speed*dt;
}

player.rotation.y=yaw;
player.position.x=THREE.MathUtils.clamp(player.position.x,-65,65);
player.position.z=THREE.MathUtils.clamp(player.position.z,-65,65);

enemies.forEach(e=>{
const d=player.position.clone().sub(e.position);
const distance=d.length();
if(distance>1.5){
d.normalize();
e.position.addScaledVector(d,1.2*dt);
e.rotation.y=Math.atan2(-d.x,-d.z);
}else{
health-=10*dt;
hp.textContent=Math.max(0,Math.floor(health));
}
});
if(health<=0)finish("GAME OVER!");

bullets.forEach(b=>{
b.pos.addScaledVector(b.dir,25*dt);
b.life--;
const mesh=part(scene,new THREE.SphereGeometry(.09,6,6),new THREE.MeshBasicMaterial({color:0xffee55}),b.pos.x,b.pos.y,b.pos.z);
b.mesh=mesh;
const hit=enemies.find(e=>b.pos.distanceTo(e.position.clone().add(new THREE.Vector3(0,1,0)))<1);
if(hit){
scene.remove(hit);
enemies.splice(enemies.indexOf(hit),1);
b.life=0;
kills++;
document.getElementById('kills').textContent=kills;
document.getElementById('count').textContent=enemies.length;
}
});
for(let i=bullets.length-1;i>=0;i--){
let b=bullets[i];
if(b.mesh)scene.remove(b.mesh);
if(b.life<=0)bullets.splice(i,1);
}
if(enemies.length===0)finish("🏆 VELOX CHAMPION!");
}

const offset=new THREE.Vector3(0,4,7);
offset.applyAxisAngle(new THREE.Vector3(0,1,0),yaw);
camera.position.lerp(player.position.clone().add(offset),.12);
camera.lookAt(player.position.x,player.position.y+1,player.position.z);
renderer.render(scene,camera);
}
animate();

onresize=()=>{
camera.aspect=innerWidth/innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(innerWidth,innerHeight);
};
</script>
</body>
</html>
