
<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VELOX BATTLE</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101923;color:white;font-family:Arial;text-align:center}
h1{color:#16d9ff}
canvas{width:96%;max-width:700px;background:#426c48;border:3px solid #16d9ff;border-radius:12px;touch-action:none}
button{padding:14px;margin:5px;border:0;border-radius:10px;background:#087fba;color:white;font-weight:bold;font-size:17px}
#info{font-size:17px;margin:10px}
</style>
</head>
<body>
<h1>VELOX BATTLE</h1>
<div id="info">❤️ Health: 100 | ⭐ Score: 0</div>
<canvas id="game" width="700" height="450"></canvas>
<div>
<button onclick="move('up')">⬆️</button><br>
<button onclick="move('left')">⬅️</button>
<button onclick="move('down')">⬇️</button>
<button onclick="move('right')">➡️</button>
<br><button onclick="fire()">🎯 FIRE</button>
<button onclick="start()">RESTART</button>
</div>
<p id="msg">Press RESTART to play!</p>
<script>
const c=document.getElementById("game");
const ctx=c.getContext("2d");
let player={x:350,y:225};
let targets=[],score=0,health=100,playing=false;
let bullets=[];
function start(){
player={x:350,y:225};
targets=[];bullets=[];score=0;health=100;playing=true;
for(let i=0;i<6;i++){
targets.push({x:40+Math.random()*620,y:40+Math.random()*370,alive:true});
}
document.getElementById("msg").textContent="Survive and hit all targets!";
draw();
}
function move(dir){
if(!playing)return;
if(dir==="up")player.y-=18;
if(dir==="down")player.y+=18;
if(dir==="left")player.x-=18;
if(dir==="right")player.x+=18;
player.x=Math.max(15,Math.min(685,player.x));
player.y=Math.max(15,Math.min(435,player.y));
draw();
}
function fire(){
if(!playing)return;
let target=targets.find(t=>t.alive);
if(!target)return;
bullets.push({x:player.x,y:player.y,tx:target.x,ty:target.y,life:1});
let hit=targets.find(t=>t.alive&&Math.hypot(t.x-player.x,t.y-player.y)<230);
if(hit){hit.alive=false;score++;}
if(targets.every(t=>!t.alive)){
playing=false;
document.getElementById("msg").textContent="🏆 YOU WIN! VELOX CHAMPION!";
}
draw();
}
function draw(){
ctx.clearRect(0,0,700,450);
ctx.fillStyle="#426c48";ctx.fillRect(0,0,700,450);
ctx.strokeStyle="#547b59";
for(let i=0;i<700;i+=35){
ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i,450);ctx.stroke();
}
for(let i=0;i<450;i+=35){
ctx.beginPath();ctx.moveTo(0,i);ctx.lineTo(700,i);ctx.stroke();
}
ctx.strokeStyle="#9deeff";ctx.lineWidth=5;
ctx.beginPath();ctx.arc(350,225,205,0,Math.PI*2);ctx.stroke();
ctx.lineWidth=1;
targets.forEach(t=>{
if(!t.alive)return;
ctx.fillStyle="#ffb347";
ctx.beginPath();ctx.arc(t.x,t.y,13,0,Math.PI*2);ctx.fill();
});
ctx.fillStyle="#00d9ff";
ctx.beginPath();ctx.arc(player.x,player.y,14,0,Math.PI*2);ctx.fill();
ctx.fillStyle="white";ctx.fillRect(player.x-4,player.y-21,8,5);
document.getElementById("info").textContent="❤️ Health: "+health+" | ⭐ Score: "+score;
}
start();
</script>
</body>
</html>
