<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Velox Battle - PUBG Style 3D Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #87CEEB;
            font-family: Arial, sans-serif;
        }
        #hud {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            z-index: 10;
            min-width: 180px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .title {
            font-weight: bold;
            font-size: 15px;
            color: #FFD700;
            margin-bottom: 5px;
        }
        .health-bar {
            width: 100%;
            height: 12px;
            background: #444;
            border-radius: 6px;
            overflow: hidden;
            margin: 5px 0;
        }
        #health-fill {
            width: 100%;
            height: 100%;
            background: #00FF66;
            transition: width 0.2s;
        }
        #minimap-container {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 110px;
            height: 110px;
            border-radius: 50%;
            border: 3px solid #10B981;
            background: rgba(16, 185, 129, 0.3);
            overflow: hidden;
            z-index: 10;
        }
        #minimap {
            width: 100%;
            height: 100%;
        }
        #controls {
            position: absolute;
            bottom: 15px;
            left: 0;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            z-index: 10;
            padding: 0 10px;
        }
        .btn-row {
            display: flex;
            gap: 8px;
            justify-content: center;
            width: 100%;
            max-width: 400px;
        }
        .btn {
            background: rgba(0, 0, 0, 0.75);
            color: white;
            border: 1px solid #ffffff55;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 12px;
            flex: 1;
            text-align: center;
            touch-action: manipulation;
        }
        .btn:active {
            background: rgba(255, 255, 255, 0.4);
        }
        .btn-fire {
            background: rgba(220, 38, 38, 0.85);
            border-color: #ef4444;
        }
        .btn-gun {
            background: rgba(37, 99, 235, 0.85);
            border-color: #3b82f6;
        }
        #hit-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 0, 0, 0.3);
            display: none;
            pointer-events: none;
            z-index: 5;
        }
    </style>
    <!-- Three.js 3D Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="hit-overlay"></div>

    <div id="hud">
        <div class="title">VELOX BATTLE 8.0 (PUBG MOD)</div>
        <div>HEALTH: <span id="hp-text">100</span>/100</div>
        <div class="health-bar"><div id="health-fill"></div></div>
        <div>ZONE: <span id="zone-dist">50m</span></div>
        <div>ENEMIES: <span id="enemies-left">8</span></div>
        <div>GUN: <span id="gun-type">PISTOL</span></div>
        <div>STATUS: <span id="zone-status" style="color:#00FF66;">SAFE</span></div>
    </div>

    <div id="minimap-container">
        <canvas id="minimap"></canvas>
    </div>

    <div id="controls">
        <div class="btn-row">
            <div class="btn" id="btn-left">LEFT</div>
            <div class="btn" id="btn-move">MOVE</div>
            <div class="btn" id="btn-right">RIGHT</div>
            <div class="btn" id="btn-sprint">SPRINT</div>
        </div>
        <div class="btn-row">
            <div class="btn btn-gun" id="btn-change-gun">CHANGE GUN</div>
            <div class="btn btn-fire" id="btn-fire">FIRE</div>
        </div>
    </div>

    <script>
        // Game State Variables
        let health = 100;
        let enemiesCount = 8;
        let currentGun = 'PISTOL';
        let speed = 0.15;
        let isSprinting = false;

        // Scene Setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        scene.fog = new THREE.FogExp2(0x87CEEB, 0.015);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Lighting
        const light = new THREE.DirectionalLight(0xffffff, 1);
        light.position.set(20, 40, 20);
        scene.add(light);
        scene.add(new THREE.AmbientLight(0x666666));

        // Ground
        const groundGeo = new THREE.PlaneGeometry(300, 300);
        const groundMat = new THREE.MeshBasicMaterial({ color: 0x4B7A47 });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        scene.add(ground);

        // Player Box
        const playerGeo = new THREE.BoxGeometry(1.2, 2.5, 1.2);
        const playerMat = new THREE.MeshBasicMaterial({ color: 0x2563EB });
        const player = new THREE.Mesh(playerGeo, playerMat);
        player.position.set(0, 1.25, 0);
        scene.add(player);

        // Buildings / Cover Walls
        const wallMat = new THREE.MeshBasicMaterial({ color: 0xA88B68 });
        function createBuilding(x, z, w, h, d) {
            const bGeo = new THREE.BoxGeometry(w, h, d);
            const b = new THREE.Mesh(bGeo, wallMat);
            b.position.set(x, h/2, z);
            scene.add(b);
        }
        createBuilding(-15, -20, 12, 8, 12);
        createBuilding(18, -30, 10, 6, 10);
        createBuilding(0, -45, 15, 10, 15);

        // Enemies Creation
        const enemies = [];
        const enemyGeo = new THREE.BoxGeometry(1.2, 2.5, 1.2);
        const enemyMat = new THREE.MeshBasicMaterial({ color: 0xDC2626 });

        for(let i=0; i<enemiesCount; i++) {
            const e = new THREE.Mesh(enemyGeo, enemyMat);
            e.position.set(
                (Math.random() - 0.5) * 120,
                1.25,
                -10 - Math.random() * 90
            );
            scene.add(e);
            enemies.push(e);
        }

        // Camera Follow
        camera.position.set(0, 5, 8);

        function updateCamera() {
            camera.position.x = player.position.x + Math.sin(player.rotation.y) * 7;
            camera.position.z = player.position.z + Math.cos(player.rotation.y) * 7;
            camera.position.y = player.position.y + 4;
            camera.lookAt(player.position.x, player.position.y + 1, player.position.z);
        }

        // Control Listeners
        let moveForward = false;
        let turnLeft = false;
        let turnRight = false;

        function bindBtn(id, onPress, onRelease) {
            const el = document.getElementById(id);
            el.addEventListener('touchstart', (e) => { e.preventDefault(); onPress(); });
            el.addEventListener('touchend', (e) => { e.preventDefault(); onRelease(); });
            el.addEventListener('mousedown', onPress);
            el.addEventListener('mouseup', onRelease);
        }

        bindBtn('btn-move', () => moveForward = true, () => moveForward = false);
        bindBtn('btn-left', () => turnLeft = true, () => turnLeft = false);
        bindBtn('btn-right', () => turnRight = true, () => turnRight = false);

        bindBtn('btn-sprint', () => {
            isSprinting = !isSprinting;
            document.getElementById('btn-sprint').style.background = isSprinting ? '#10B981' : 'rgba(0,0,0,0.75)';
        }, ()=>{});

        bindBtn('btn-change-gun', () => {
            currentGun = (currentGun === 'PISTOL') ? 'AK47' : 'PISTOL';
            document.getElementById('gun-type').innerText = currentGun;
        }, ()=>{});

        bindBtn('btn-fire', shoot, ()=>{});

        // Shooting Logic
        function shoot() {
            const raycaster = new THREE.Raycaster();
            const dir = new THREE.Vector3(
                -Math.sin(player.rotation.y),
                0,
                -Math.cos(player.rotation.y)
            );
            raycaster.set(player.position, dir);

            const intersects = raycaster.intersectObjects(enemies);
            if(intersects.length > 0 && intersects[0].distance < 35) {
                const hitEnemy = intersects[0].object;
                scene.remove(hitEnemy);
                const index = enemies.indexOf(hitEnemy);
                if (index > -1) enemies.splice(index, 1);
                
                enemiesCount--;
                document.getElementById('enemies-left').innerText = enemiesCount;
            }
        }

        // Minimap Render
        const mapCanvas = document.getElementById('minimap');
        const mapCtx = mapCanvas.getContext('2d');
        mapCanvas.width = 110;
        mapCanvas.height = 110;

        function drawMinimap() {
            mapCtx.clearRect(0, 0, 110, 110);
            
            // Player Dot
            mapCtx.fillStyle = '#FFD700';
            mapCtx.beginPath();
            mapCtx.arc(55, 55, 4, 0, Math.PI * 2);
            mapCtx.fill();

            // Enemy Dots
            mapCtx.fillStyle = '#DC2626';
            enemies.forEach(e => {
                const dx = (e.position.x - player.position.x) * 0.8;
                const dz = (e.position.z - player.position.z) * 0.8;
                if(Math.abs(dx) < 50 && Math.abs(dz) < 50) {
                    mapCtx.beginPath();
                    mapCtx.arc(55 + dx, 55 + dz, 3, 0, Math.PI * 2);
                    mapCtx.fill();
                }
            });
        }

        // Main Game Loop
        function animate() {
            requestAnimationFrame(animate);

            const currSpeed = isSprinting ? speed * 1.8 : speed;

            if (turnLeft) player.rotation.y += 0.04;
            if (turnRight) player.rotation.y -= 0.04;

            if (moveForward) {
                player.position.x -= Math.sin(player.rotation.y) * currSpeed;
                player.position.z -= Math.cos(player.rotation.y) * currSpeed;
            }

            updateCamera();
            drawMinimap();

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
